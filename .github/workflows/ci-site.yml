name: CI site

on:
  pull_request:
    paths:
      - "site/**"
      - "scripts/setup_cloudflare.sh"
      - ".github/workflows/ci-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/setup_cloudflare.sh"
      - ".github/workflows/ci-site.yml"

concurrency:
  group: ci-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: site (types, Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  wizard:
    name: setup wizard (self-test)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: bash scripts/setup_cloudflare.sh --self-test
