name: Deploy site

# On merge to main: test the site, then deploy the cron Worker and the Pages project (page and
# /api/leaderboard). Cloudflare's Git integration stays off (PLAN.md, CI/CD).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: test, then deploy Worker and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      # Token scopes: Cloudflare Pages Edit, Workers Scripts Edit, Workers KV Storage Edit
      # (scripts/setup_cloudflare.sh). wrangler reads the account from the environment.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Deploy the cron Worker
        run: npm run deploy:worker
      # The page's build step, once it has one.
      - run: npm run build --if-present
      - name: Deploy Pages (public/ and functions/)
        run: npm run deploy:pages
      # TODO(Sprint 11): hand LEADERBOARD_PUSH_SECRET to the site for /api/expected-points, e.g.
      #   echo "$LEADERBOARD_PUSH_SECRET" | npx wrangler pages secret put LEADERBOARD_PUSH_SECRET --project-name ffp-leaderboard
      # with LEADERBOARD_PUSH_SECRET: ${{ secrets.LEADERBOARD_PUSH_SECRET }} in this step's env only.
