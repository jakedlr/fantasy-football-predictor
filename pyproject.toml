[project]
name = "ffp"
version = "0.1.0"
description = "NFL fantasy Score Distributions from sportsbook prop prices"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "nflreadpy>=0.1.5", "scrapling[fetchers]>=0.3", "jsonschema>=4.18", "tzdata"]

[project.optional-dependencies]
dev = ["pytest", "numpy"]

[project.scripts]
ffp = "ffp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffp = ["rules/*.json", "params/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["live: hits real sportsbook endpoints; run with -m live"]
addopts = "-m 'not live'"
