# The Leaderboard's cron Worker (src/worker/index.ts, ADR 0006).
# Deploy from site/: npm run deploy:worker. The account comes from CLOUDFLARE_ACCOUNT_ID in the
# environment (a GitHub secret in CI; site/.cloudflare-ids.env locally), never from this file.
name = "ffp-leaderboard-cron"
main = "../src/worker/index.ts"
compatibility_date = "2026-11-01"
workers_dev = false

[triggers]
# Must match SCOREBOARD_CRON and STATS_CRON in src/worker/index.ts (a test checks).
# Scoreboard run at minutes 2, 7, 12, ...; stats run at 0, 5, 10, ... (S10.1: one source per run).
crons = ["2-59/5 * * * *", "*/5 * * * *"]

[observability]
enabled = true

# KV namespace ids aren't secret (PLAN.md); the setup wizard recorded them in site/.cloudflare-ids.env.
[[kv_namespaces]]
binding = "LEADERBOARD"
id = "505854716af94d8d9420b88da26d29a2"
preview_id = "fda7273654e84716abf4f9f25dcd72e8"
