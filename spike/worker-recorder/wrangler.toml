# Throwaway S9.1 Live test recorder. Deploy and remove: see README.md in this folder.
name = "ffp-live-spike"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
# Thursday Night Football, NFL Week 11: IND @ HOU, kickoff 2026-11-20T01:15Z (8:15 PM ET).
EVENT_ID = "401873066"
SEASON = "2026"
WEEK = "11"
# Record 30 min before kickoff to 4.5 h after (300 KV writes; the free plan allows 1,000 a day).
RECORD_FROM = "2026-11-20T00:45:00Z"
RECORD_UNTIL = "2026-11-20T05:45:00Z"

[[kv_namespaces]]
binding = "SPIKE"
# Paste the id printed by `npx wrangler kv namespace create SPIKE`.
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[observability]
enabled = true
